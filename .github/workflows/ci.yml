# Prüfungen für jeden Push und Pull Request:
# Typecheck, Lint, Unit-/Integrationstests (PostgreSQL 17), Produktionsbuild und Browser-Tests.
# Es werden nur Wegwerf-Zugangsdaten für die CI-Datenbank verwendet – keine echten Secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_DATABASE_ADMIN_URL: postgres://pflegewerk_owner:ci_owner_pw@localhost:5432/postgres
  CI_APP_ROLE_PASSWORD: ci_app_pw
  DATABASE_APP_ROLE: pflegewerk_app
  DATABASE_URL: postgres://pflegewerk_app:ci_app_pw@localhost:5432/pflegewerk_test
  TEST_DATABASE_URL: postgres://pflegewerk_app:ci_app_pw@localhost:5432/pflegewerk_test
  TEST_DATABASE_OWNER_URL: postgres://pflegewerk_owner:ci_owner_pw@localhost:5432/pflegewerk_test
  APP_URL: http://localhost:3000
  APP_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pflegewerk_owner
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pflegewerk_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Datenbankrollen anlegen
        run: npx tsx scripts/ci-setup-db.ts
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit- und Integrationstests
        run: npm test
      - name: Produktionsbuild
        run: npm run build

  e2e:
    name: Browser-Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pflegewerk_owner
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pflegewerk_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Datenbankrollen anlegen
        run: npx tsx scripts/ci-setup-db.ts
      # Die Tests nutzen das auf dem Runner vorinstallierte Google Chrome (channel: "chrome").
      - name: Browser-Tests
        run: npm run test:e2e
      - name: Playwright-Traces bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
